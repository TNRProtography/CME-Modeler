name = "spot-the-aurora-forecast-worker"
main = "worker/forecast-entry.js"
compatibility_date = "2026-03-04"
workers_dev = true

# Hourly. The inputs move slower than that - coronal holes are re-detected
# every couple of hours by whichever client is open, and the L1 feed updates
# every minute but the forecast only depends on its daily shape.
[triggers]
crons = ["7 * * * *"]

# Created with:  wrangler kv namespace create FORECAST_KV
# then paste the id here. The dashboard binding is not enough on its own:
# a `wrangler deploy` replaces the worker's bindings with exactly what this
# file lists, so a placeholder here removes a binding added in the UI.
[[kv_namespaces]]
binding = "FORECAST_KV"
id = "9444bb31349745efa353ddfee9080596"

# Both upstreams are Workers on this same workers.dev subdomain. A plain fetch
# to their public hostnames loops back to this worker and answers 404 without
# ever reaching them, so they are addressed directly instead.
[[services]]
binding = "CH_HISTORY"
service = "ch-history-worker"

[[services]]
binding = "RTSW"
service = "imap-solar-data-test"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Dev copy: dev-spot-the-aurora-forecast-worker.  Deploy with  --env dev
# Bindings are not inherited by an env, so they are repeated. Its own KV keeps
# dev forecasts and scoring apart from live.
# ---------------------------------------------------------------------------
[env.dev]
name = "dev-spot-the-aurora-forecast-worker"
workers_dev = true

[env.dev.triggers]
crons = ["7 * * * *"]

# Create a new KV namespace called dev-FORECAST_KV and paste its ID here.
[[env.dev.kv_namespaces]]
binding = "FORECAST_KV"
id = "REPLACE_WITH_DEV_FORECAST_KV_ID"

[[env.dev.services]]
binding = "CH_HISTORY"
service = "ch-history-worker"

[[env.dev.services]]
binding = "RTSW"
service = "imap-solar-data-test"
