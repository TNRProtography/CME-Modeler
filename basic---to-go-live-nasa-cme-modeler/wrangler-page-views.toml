# Deployed by Cloudflare Workers Builds from this repo. Mirrors the dashboard
# settings: a deploy replaces bindings, variables and crons with exactly what
# this file lists. Secrets are never in here (the repo is public); they stay
# as Cloudflare secrets and survive deploys. See worker/DEPLOYING.md.
name = "page-views"
main = "worker/page-views-worker.js"
compatibility_date = "2026-03-04"
workers_dev = true

[observability]
enabled = true

# The counter lives in one Durable Object with its own SQLite database. Nothing
# to create in the dashboard: the migration below makes it on the first deploy.
[[durable_objects.bindings]]
name = "PAGE_VIEWS"
class_name = "PageViews"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageViews"]
