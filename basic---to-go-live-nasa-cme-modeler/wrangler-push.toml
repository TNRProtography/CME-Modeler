# Deployed by Cloudflare Workers Builds from this repo. Mirrors the dashboard
# settings: a deploy replaces bindings, variables and crons with exactly what
# this file lists. Secrets are never in here (the repo is public); they stay
# as Cloudflare secrets and survive deploys. See worker/DEPLOYING.md.
name = "push-notification-worker"
main = "worker/push-notification-worker.js"
compatibility_date = "2026-03-04"
workers_dev = true

[observability]
enabled = true

# Secrets (set in the dashboard): VAPID_PRIVATE_KEY, TRIGGER_SECRET,
# BANNER_AUTH_TOKEN. Optional: NASA_API_KEY.

[vars]
SELF_URL = "https://push-notification-worker.thenamesrock.workers.dev"
# Public by design; the app ships the same key in utils/notifications.ts.
VAPID_PUBLIC_KEY = "BIQ9JadNJgyMDPebgXu5Vpf7-7XuCcl5uEaxocFXeIdUxDq1Q9bGe0E5C8-a2qQ-psKhqbAzV2vELkRxpnWqebU"
VAPID_SUBJECT = "mailto:help@spottheaurora.co.nz"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
id = "acf56e07e91340f29f3132caac4addc3"

[[services]]
binding = "SELF"
service = "push-notification-worker"

[[services]]
binding = "DONKI"
service = "nasa-donki-api"

[[services]]
binding = "FORECAST_SERVICE"
service = "spottheaurora"

[[services]]
binding = "rtsw"
service = "imap-solar-data-test"

[[services]]
binding = "SUBSTORM"
service = "aurora-index-sta"

# ---------------------------------------------------------------------------
# Dev copy: dev-push-notification-worker.  Deploy with  --env dev
# Bindings and vars are not inherited by an env, so all of them are repeated.
# It reads the same live data workers, but keeps its own subscribers so dev
# testing never pushes to real users. Same VAPID key pair as live, because the
# app has the public key built in: give it the same VAPID_PRIVATE_KEY secret.
# ---------------------------------------------------------------------------
[env.dev]
name = "dev-push-notification-worker"
workers_dev = true

[env.dev.vars]
SELF_URL = "https://dev-push-notification-worker.thenamesrock.workers.dev"
VAPID_PUBLIC_KEY = "BIQ9JadNJgyMDPebgXu5Vpf7-7XuCcl5uEaxocFXeIdUxDq1Q9bGe0E5C8-a2qQ-psKhqbAzV2vELkRxpnWqebU"
VAPID_SUBJECT = "mailto:help@spottheaurora.co.nz"

[env.dev.triggers]
crons = ["* * * * *"]

# Create a new KV namespace called dev-SUBSCRIPTIONS_KV and paste its ID here.
[[env.dev.kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
id = "REPLACE_WITH_DEV_SUBSCRIPTIONS_KV_ID"

[[env.dev.services]]
binding = "SELF"
service = "dev-push-notification-worker"

[[env.dev.services]]
binding = "DONKI"
service = "nasa-donki-api"

[[env.dev.services]]
binding = "FORECAST_SERVICE"
service = "spottheaurora"

[[env.dev.services]]
binding = "rtsw"
service = "imap-solar-data-test"

[[env.dev.services]]
binding = "SUBSTORM"
service = "aurora-index-sta"
