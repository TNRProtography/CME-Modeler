# Deployed by Cloudflare Workers Builds from this repo. Mirrors the dashboard
# settings: a deploy replaces bindings, variables and crons with exactly what
# this file lists. Secrets are never in here (the repo is public); they stay
# as Cloudflare secrets and survive deploys. See worker/DEPLOYING.md.
name = "push-notification-worker"
main = "worker/push-notification-worker.js"
compatibility_date = "2026-03-04"
workers_dev = true

[observability]
enabled = true

# Secrets (set in the dashboard): VAPID_PRIVATE_KEY, TRIGGER_SECRET,
# BANNER_AUTH_TOKEN. Optional: NASA_API_KEY.

[vars]
SELF_URL = "https://push-notification-worker.thenamesrock.workers.dev"
# Public by design; the app ships the same key in utils/notifications.ts.
VAPID_PUBLIC_KEY = "BIQ9JadNJgyMDPebgXu5Vpf7-7XuCcl5uEaxocFXeIdUxDq1Q9bGe0E5C8-a2qQ-psKhqbAzV2vELkRxpnWqebU"
VAPID_SUBJECT = "mailto:help@spottheaurora.co.nz"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
id = "acf56e07e91340f29f3132caac4addc3"

[[services]]
binding = "SELF"
service = "push-notification-worker"

[[services]]
binding = "DONKI"
service = "nasa-donki-api"

[[services]]
binding = "FORECAST_SERVICE"
service = "spottheaurora"

[[services]]
binding = "rtsw"
service = "imap-solar-data-test"

[[services]]
binding = "SUBSTORM"
service = "aurora-index-sta"
