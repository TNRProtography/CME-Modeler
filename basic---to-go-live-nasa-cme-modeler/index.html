  <!-- Recover from stale Cloudflare/Vite HTML that points at an old hashed JS asset.
       This runs before the app bundle, so it also catches entry-script failures that
       React.lazy() cannot see. Third-party blocked scripts (analytics/extensions) are ignored. -->
  <script>
    (function () {
      var KEY = 'sta_entry_asset_reload_attempted_at';
      var RETRY_WINDOW_MS = 30000;
      var PARAM = 'sta_asset_bust';
      function isSameOriginAsset(url) {
        try {
          var parsed = new URL(url, window.location.href);
          return parsed.origin === window.location.origin && /^\/assets\/.*\.js(?:\?|$)/.test(parsed.pathname + parsed.search);
        } catch (_) {
          return false;
        }
      }
      function recover() {
        try {
          var last = Number(sessionStorage.getItem(KEY) || '0');
          if (Number.isFinite(last) && Date.now() - last <= RETRY_WINDOW_MS) return;
          sessionStorage.setItem(KEY, String(Date.now()));
          var next = new URL(window.location.href);
          next.searchParams.set(PARAM, String(Date.now()));
          window.location.replace(next.toString());
        } catch (_) {
          window.location.reload();
        }
      }
      window.addEventListener('error', function (event) {
        var target = event && event.target;
        var url = target && (target.src || target.href);
        if (!url || !isSameOriginAsset(url)) return;
        recover();
      }, true);
    })();
  </script>

  <!-- Start the landing page's core feeds now, while the app's JavaScript is
       still downloading, instead of after it has run - which on a phone was
       a second and a half later. The app picks these requests up
       (utils/sharedFetch) rather than making its own. The addresses and keys
       here are checked against the app's by npm run test:boot-fetch. -->
  <script>
    (function () {
      try {
        // Embedded in the marketing site: no full-screen splash in a small box.
        if (/[?&]embed(=|&|$)/.test(location.search)) document.documentElement.className += ' st-embed';
        var path = location.pathname, page = null, store = null;
        if (path.indexOf('/spot-the-aurora-forecast') === 0) page = 'forecast';
        else if (path.indexOf('/solar-dashboard') === 0) page = 'solar-activity';
        else if (path.indexOf('/cme-visualization') === 0) page = 'modeler';
        try { store = window.localStorage; } catch (_) {}
        if (!page) {
          var saved = store && store.getItem('sta_default_main_page');
          page = saved === 'solar-activity' || saved === 'modeler' ? saved : 'forecast';
        }
        var dashboard = !!store && store.getItem('dashboard_mode_enabled_v1') === 'true';
        window.__stLandingPage = dashboard ? 'dashboard' : page;
        if (!dashboard && page !== 'forecast') return;
        var urls = [
          'https://spottheaurora.thenamesrock.workers.dev/',
          'https://imap-solar-data-test.thenamesrock.workers.dev/rtsw/merged-24h',
          'https://aurora-index-sta.thenamesrock.workers.dev/api/substorm?resolution=5m'
        ];
        var boot = window.__stBoot = {};
        urls.forEach(function (url) {
          var at = Date.now();
          var p = fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + at).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
            return r.text();
          });
          p.catch(function () {});
          boot[url] = { at: at, promise: p };
        });
      } catch (_) {
        // The app fetches for itself.
      }
    })();
  </script>

  <!-- Each of the app's three pages has its own address, and is now described
       as its own page rather than as a copy of the home page: its own title,
       description and canonical address. Run here, before the app, so a
       crawler sees them on first render; the app calls it again when the page
       changes. The address "/" keeps the defaults above. -->
  <script>
    (function () {
      var BASE = 'https://spottheaurora.co.nz';
      var PAGES = [
        { prefix: '/spot-the-aurora-forecast', path: '/spot-the-aurora-forecast',
          title: 'Aurora Forecast NZ: Live Aurora Australis Score | Spot The Aurora',
          description: 'Can you see the aurora tonight from where you are? A live southern lights forecast for New Zealand: naked eye, phone camera or long exposure, adjusted for your location, the Moon and cloud, with substorm alerts.' },
        { prefix: '/solar-dashboard', path: '/solar-dashboard',
          title: 'Live Solar Activity: Flares, Sunspots, Coronal Holes | Spot The Aurora',
          description: 'What the Sun is doing right now: live X-ray flares, sunspot regions with flare chances, coronal holes and their high-speed streams, proton flux and coronagraph imagery, explained for aurora chasers in New Zealand.' },
        { prefix: '/cme-visualization', path: '/cme-visualization',
          title: '3D CME Tracker: CMEs Heading for Earth | Spot The Aurora',
          description: 'Watch coronal mass ejections and high-speed solar wind streams travel from the Sun to Earth in a live 3D model, with arrival times and the impact they could have on the aurora in New Zealand.' }
      ];
      var defaults = null;
      function set(sel, attr, value) {
        var el = document.head.querySelector(sel);
        if (el) el.setAttribute(attr, value);
      }
      window.__stApplyPageMeta = function (pathname) {
        try {
          if (!defaults) {
            var d = document.head.querySelector('meta[name="description"]');
            defaults = { title: document.title, description: d ? d.getAttribute('content') : '' };
          }
          var page = null;
          for (var i = 0; i < PAGES.length; i++) if (pathname.indexOf(PAGES[i].prefix) === 0) page = PAGES[i];
          var url = BASE + (page ? page.path : '/');
          document.title = page ? page.title : defaults.title;
          set('meta[name="description"]', 'content', page ? page.description : defaults.description);
          set('link[rel="canonical"]', 'href', url);
          set('meta[property="og:url"]', 'content', url);
          set('link[rel="alternate"][hreflang="en-nz"]', 'href', url);
          set('link[rel="alternate"][hreflang="x-default"]', 'href', url);
        } catch (_) { /* never in the way of the app */ }
      };
      window.__stApplyPageMeta(location.pathname);
    })();
  </script>

  <!-- Three.js, OrbitControls and GSAP are loaded on-demand when the CME modeler is first opened -->

  <style>
    /* IMPORTANT: overflow:hidden must be on <html>, NOT <body>.
       On iOS Safari, overflow:hidden on body clips ALL position:fixed children (including portals).
       Moving it to html avoids this while still preventing page scroll. */
    html {
      overflow: hidden;
      height: 100%;
    }
    body {
      margin: 0;
      font-family: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background-color: #171717;
      color: #d4d4d4;
      height: 100%;
    }
    button, input, select, textarea {
      font-family: inherit;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #262626; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #525252; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #737373; }

    .leaflet-container { background-color: #1a1a1a !important; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #262626;
      color: #d4d4d4;
      box-shadow: 0 3px 14px rgba(0,0,0,0.4);
    }
    .emoji-marker { background-color: transparent !important; border: none !important; }
    .emoji-marker div {
      width: 32px; height: 32px; line-height: 32px; text-align: center;
      font-size: 28px; text-shadow: 0 0 5px black;
    }
    :root {
      --solar-flare-ab-rgb: 34, 197, 94;
      --solar-flare-c-rgb: 245, 158, 11;
      --solar-flare-m-rgb: 255, 69, 0;
      --solar-flare-x-rgb: 147, 112, 219;
      --solar-flare-x5plus-rgb: 255, 105, 180;
      --proton-s0-rgb: 34, 197, 94;
      --proton-s1-rgb: 255, 215, 0;
      --proton-s2-rgb: 255, 165, 0;
      --proton-s3-rgb: 255, 69, 0;
      --proton-s4-rgb: 128, 0, 128;
      --proton-s5-rgb: 255, 20, 147;
    }
    /* Timeline portal: sits outside #root, unaffected by overflow:hidden on body/root.
       No z-index on the portal itself - the child div sets its own position:fixed and zIndex.
       pointer-events:none so the zero-height portal element doesn't block clicks. */
    #timeline-portal {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0;
      overflow: visible;
      pointer-events: none;
    }
    #timeline-portal > * {
      pointer-events: auto;
    }

    /* Modern micro-interactions and animated chrome */
    @keyframes auroraFlow {
      0% { transform: translateX(-30%) translateY(0); opacity: 0.18; }
      50% { transform: translateX(10%) translateY(-8%); opacity: 0.32; }
      100% { transform: translateX(40%) translateY(6%); opacity: 0.18; }
    }

    @keyframes sheenSweep {
      0% { transform: translateX(-120%); opacity: 0; }
      35% { opacity: 0.25; }
      50% { transform: translateX(20%); opacity: 0.4; }
      65% { opacity: 0.2; }
      100% { transform: translateX(160%); opacity: 0; }
    }

    /* Only transform is animated here. box-shadow is not a composited property,
       so tweening it repainted every panel on the page on every frame, forever,
       which is the single most expensive thing the dashboard was doing. */
    @keyframes cardFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    @keyframes fadeUpSoft {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modern-cta {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    /* A still glow. It used to drift forever under a 12px blur, which
       re-ran the blur on every frame for every nav button; the gradient is
       already soft, and the sheen below is the movement. */
    .modern-cta::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), rgba(255,255,255,0) 60%);
      z-index: 0;
      pointer-events: none;
    }
    .modern-cta::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
      animation: sheenSweep 6s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }
    .modern-cta > * { position: relative; z-index: 1; }

    /* The nav badges' movement (components/icons/NavBadgeIcons.tsx). Only
       transform and opacity, on whole layers, so it runs on the GPU. The
       origins are where each part sits in the 64-unit icon. */
    .nav-badge-anim { will-change: transform, opacity; }
    .nav-badge-glow { animation: navBadgeGlow 4s ease-in-out infinite; }
    .nav-badge-aurora { transform-origin: 50% 75%; animation: navBadgeSway 6s ease-in-out infinite; }
    .nav-badge-moon { transform-origin: 31.25% 37.5%; animation: navBadgeMoon 3s ease-in-out infinite; }
    .nav-badge-star { animation: navBadgeStar 5s ease-in-out infinite; }
    .nav-badge-sun { animation: navBadgeSun 3s ease-in-out infinite; }
    .nav-badge-rays { animation: navBadgeRays 2.4s ease-in-out infinite; }
    .nav-badge-flare { transform-origin: 50% 66%; animation: navBadgeFlare 4s ease-in-out infinite; }
    .nav-badge-orbit { animation: navBadgeOrbit 9s linear infinite; }
    .nav-badge-planet { transform-origin: 78.125% 43.75%; animation: navBadgePlanet 5s ease-in-out infinite; }
    .nav-badge-moonlet { animation: navBadgeMoonlet 6s ease-in-out infinite; }
    @keyframes navBadgeGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    @keyframes navBadgeSway { 0%, 100% { transform: none; } 50% { transform: translateY(-2%) scaleY(1.06); } }
    @keyframes navBadgeMoon { 0%, 100% { transform: scale(0.84); } 50% { transform: scale(1.08); } }
    @keyframes navBadgeStar { 0%, 100% { transform: none; } 50% { transform: translate(3.1%, -1.6%); } }
    @keyframes navBadgeSun { 0%, 100% { transform: none; } 50% { transform: scale(1.06); } }
    @keyframes navBadgeRays { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes navBadgeFlare { 0%, 100% { transform: none; } 50% { transform: translateY(-2.5%) scaleX(1.02); } }
    @keyframes navBadgeOrbit { to { transform: rotate(-360deg); } }
    @keyframes navBadgePlanet { 0%, 100% { transform: scale(0.9); } 50% { transform: scale(1.2); } }
    @keyframes navBadgeMoonlet { 0%, 100% { transform: none; } 50% { transform: translate(1.6%, -3.1%); } }

    .floating-panel {
      position: relative;
      box-shadow: 0 16px 36px rgba(0,0,0,0.28);
      /* No backdrop-filter. These panels are full width and stacked down a long
         page, and they sit on a near black background behind a background that
         is already 80% opaque, so the blur cost nothing but frames. */
      border: 1px solid rgba(255,255,255,0.08);
      animation: cardFloat 18s ease-in-out infinite;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .floating-panel:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 44px rgba(0,0,0,0.32);
    }

    .soft-appear { animation: fadeUpSoft 420ms ease forwards; }

    .aurora-banner {
      position: relative;
    }
    .aurora-banner::before {
      content: "";
      position: absolute;
      inset: -30% -60%;
      background: radial-gradient(circle at 20% 60%, rgba(255,255,255,0.18), transparent 55%),
                  radial-gradient(circle at 80% 30%, rgba(125,211,252,0.18), transparent 55%);
      animation: auroraFlow 16s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 14px 28px rgba(0,0,0,0.25);
      /* See .floating-panel: the blur was invisible here and very expensive. */
      transform-origin: center;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    /* A still glow, as it looks halfway through the drift it used to have.
       That drift made every card on the page carry a moving layer half as
       big again as the card, forever - a lot of GPU memory and work on a
       phone, for a glow that peaked at a few percent opacity and moved too
       slowly to see. */
    .card::before {
      content: "";
      position: absolute;
      inset: -45% -20%;
      background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.08), transparent 55%),
                  radial-gradient(circle at 80% 40%, rgba(56,189,248,0.12), transparent 55%);
      opacity: 0.25;
      transform: translateX(5%) translateY(-4%);
      pointer-events: none;
      z-index: 0;
    }
    .card > * { position: relative; z-index: 1; }
    .card:hover { transform: translateY(-1px); box-shadow: 0 18px 36px rgba(0,0,0,0.28); }
    .aurora-banner > * { position: relative; z-index: 1; }

    @media (prefers-reduced-motion: reduce) {
      .modern-cta::before,
